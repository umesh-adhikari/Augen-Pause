<!doctype html>
<html lang="de" data-theme="dark" data-accent="teal">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>AugenPause Widget</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="./widget.css">
  <script type="module" src="./widget.js"></script>
</head>
<body>
  <!-- shared paint servers / filters (referenced from the clock layers) -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <filter id="apHandShadow" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="200" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.6"/>
        <feOffset dx="0" dy="1.2" result="blur"/>
        <feComponentTransfer>
          <feFuncA type="linear" slope="0.55"/>
        </feComponentTransfer>
        <feMerge>
          <feMergeNode/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
  </svg>

  <main class="widget" id="widget" data-mode="work" data-size="medium">
    <div class="clock" id="clock" role="button" tabindex="0" aria-describedby="dial">
      <div class="halo" aria-hidden="true"></div>
      <div class="face" aria-hidden="true"></div>
      <div class="tint" aria-hidden="true"></div>

      <div class="dimmable">
        <svg class="layer dial" id="dial" viewBox="0 0 200 200" role="img" aria-label="AugenPause"></svg>
        <svg class="layer rings" id="rings" viewBox="0 0 200 200" aria-hidden="true"></svg>
        <svg class="layer hydro-pulse" id="hydroPulse" viewBox="0 0 200 200" aria-hidden="true"></svg>

        <div class="comp comp-top" aria-hidden="true">
          <svg class="glyph glyph-drop" viewBox="0 0 24 24">
            <path d="M12 2.6C12 2.6 5.2 10.1 5.2 14.7a6.8 6.8 0 0 0 13.6 0C18.8 10.1 12 2.6 12 2.6Z"/>
            <path class="glyph-shine" d="M8.9 15.4a3.2 3.2 0 0 0 2.6 3"/>
          </svg>
          <svg class="glyph glyph-headset" viewBox="0 0 24 24">
            <path d="M4.2 14.5v-2.3a7.8 7.8 0 0 1 15.6 0v2.3"/>
            <rect x="3.2" y="13.2" width="4.6" height="6.8" rx="1.9"/>
            <rect x="16.2" y="13.2" width="4.6" height="6.8" rx="1.9"/>
            <path d="M18.5 20c0 1.4-1.6 2.2-4.2 2.2"/>
          </svg>
          <span class="comp-label" id="label"></span>
        </div>

        <div class="comp comp-bottom" aria-hidden="true">
          <svg class="glyph glyph-pause" viewBox="0 0 24 24">
            <rect x="6" y="4.5" width="4.2" height="15" rx="1.7"/>
            <rect x="13.8" y="4.5" width="4.2" height="15" rx="1.7"/>
          </svg>
          <svg class="glyph glyph-zzz" viewBox="0 0 24 24">
            <path d="M2.8 12.2h6.4l-6.4 8h6.4"/>
            <path d="M11.4 6.6h4.8l-4.8 6h4.8"/>
            <path d="M18.2 2.4h3.4l-3.4 4.2h3.4"/>
          </svg>
          <svg class="glyph glyph-moon" viewBox="0 0 24 24">
            <path d="M20.6 14.3A8.6 8.6 0 1 1 9.7 3.4a7 7 0 0 0 10.9 10.9Z"/>
            <circle class="glyph-star" cx="17.6" cy="4.6" r="1.1"/>
            <circle class="glyph-star" cx="21" cy="8.4" r="0.7"/>
          </svg>
          <span class="comp-count" id="count"></span>
        </div>

        <svg class="layer hand hand-hour" id="handHour" viewBox="0 0 200 200" aria-hidden="true"></svg>
        <svg class="layer hand hand-minute" id="handMinute" viewBox="0 0 200 200" aria-hidden="true"></svg>
        <svg class="layer hand hand-second" id="handSecond" viewBox="0 0 200 200" aria-hidden="true"></svg>
      </div>

      <div class="sheen" aria-hidden="true"></div>
    </div>

    <div class="pill-area">
      <div class="pill" id="pill" role="toolbar" data-variant="actions">
        <!-- hover: quick actions -->
        <div class="pv pv-actions" id="pvActions">
          <button type="button" class="pbtn" id="btnPause">
            <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6.5" y="5" width="3.6" height="14" rx="1.3"/>
              <rect x="13.9" y="5" width="3.6" height="14" rx="1.3"/>
            </svg>
            <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.6-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6Z"/>
            </svg>
          </button>
          <button type="button" class="pbtn pbtn-water" id="btnDrink">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3.2s-6.2 6.9-6.2 11.2a6.2 6.2 0 0 0 12.4 0C18.2 10.1 12 3.2 12 3.2Z"/>
              <path d="M12 11.6v5.2"/>
              <path d="M9.4 14.2h5.2"/>
            </svg>
            <span class="badge" id="drinkBadge"></span>
          </button>
          <button type="button" class="pbtn" id="btnDash">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="3.5" width="7" height="8.5" rx="1.8"/>
              <rect x="13.5" y="3.5" width="7" height="5" rx="1.8"/>
              <rect x="13.5" y="11.5" width="7" height="9" rx="1.8"/>
              <rect x="3.5" y="15" width="7" height="5.5" rx="1.8"/>
            </svg>
          </button>
          <!-- break now: last on purpose (hardest to hit by accident); same coffee cup as the dashboard's "Jetzt Pause" -->
          <button type="button" class="pbtn" id="btnBreak">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 2v2"/>
              <path d="M14 2v2"/>
              <path d="M6 2v2"/>
              <path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/>
            </svg>
          </button>
        </div>

        <!-- warning: break is imminent -->
        <div class="pv pv-warning" id="pvWarning" hidden>
          <div class="pstat">
            <span class="pstat-label" id="warnLabel"></span>
            <span class="pstat-time" id="warnTime"></span>
          </div>
          <button type="button" class="pbtn pbtn-text pbtn-snooze" id="btnSnoozeA"></button>
          <button type="button" class="pbtn pbtn-text pbtn-snooze" id="btnSnoozeB"></button>
          <button type="button" class="pbtn pbtn-text pbtn-small" id="btnNow"></button>
        </div>

        <!-- break without lock screen -->
        <div class="pv pv-break" id="pvBreak" hidden>
          <span class="pdot" aria-hidden="true"></span>
          <div class="pstat">
            <span class="pstat-label" id="breakLabel"></span>
            <span class="pstat-time" id="breakTime"></span>
          </div>
          <button type="button" class="pbtn pbtn-text pbtn-snooze" id="btnBreakSnooze"></button>
          <button type="button" class="pbtn pbtn-text pbtn-neutral" id="btnEnd"></button>
          <span class="strict-lock" id="strictLock" role="img">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10.5" width="14" height="10" rx="2.6"/>
              <path d="M8.3 10.5V8a3.7 3.7 0 0 1 7.4 0v2.5"/>
            </svg>
          </span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
