# AugenPause – build installers for Windows, macOS and Linux.
#
# Generic workflow: only relevant if the project is pushed to a GitHub repository.
#   pull_request       → unit tests only (fast feedback, no secrets, no installer builds)
#   push to main       → unit tests only (job name "tests" – usable as a required
#                        status check for a branch-protection rule on main)
#   workflow_dispatch  → full build on all platforms, artifacts downloadable from the run
#   tag "v*"           → full build + published release with all installers attached
#
# Update files (see docs/ARCHITECTURE.md §12, docs/PACKAGING.md → "Updates & Releases"):
#   electron-builder.yml has `publish: {provider: github, …}`, so every build also
#   writes the update feed next to the installers – latest.yml (Windows),
#   latest-mac.yml (macOS), latest-linux.yml / latest-linux-arm64.yml (Linux) – plus a
#   <artifact>.blockmap for the NSIS installers and the macOS zip.
#   electron-updater in the installed app reads resources/app-update.yml (owner/repo,
#   embedded at build time), fetches latest*.yml from the release, compares the version
#   and verifies the downloaded file against the sha512 from that file. With the
#   blockmap of old + new installer it downloads only the changed blocks. Therefore
#   latest*.yml and the *.blockmap files MUST be attached to the release next to the
#   installers – a missing blockmap only costs a full download, a missing latest*.yml
#   breaks the update check entirely.
#   `--publish never` stays on every build: the metadata is generated locally, the
#   upload happens exclusively in the release job below.
#
# Optional repository secrets (builds stay unsigned without them):
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD                 Windows code signing certificate (.pfx, base64)
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD                 macOS "Developer ID Application" certificate (.p12, base64)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   macOS notarization (only together with MAC_CSC_LINK)
#
# Hardening: never use pull_request_target here. For maximum supply-chain safety
# pin the third-party actions to full commit SHAs (see docs/PACKAGING.md).

name: Build

on:
  push:
    # A push event matches when EITHER filter matches: pushes to main run the
    # tests, tag pushes run the full build + release.
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a tag build (it produces the release), but supersede outdated
  # test runs of a pull request or of main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  # Pull requests (incl. forks) and pushes to main only get the tests: quick
  # feedback, and no 40-minute installer build triggered by an outside
  # contributor. The job name "tests" is the identifier a required status check
  # in the branch protection of main refers to – do not rename it.
  test:
    name: tests
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - shell: bash
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm test

  # Installer builds only for tags and manual runs – a push to main just runs
  # the tests above.
  build:
    name: ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform: win
            script: dist:win
          - name: macos
            os: macos-latest
            platform: mac
            script: dist:mac
          - name: linux
            os: ubuntu-latest
            platform: linux
            script: dist:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging tools (rpmbuild, bsdtar)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libarchive-tools

      # `npm ci` fails on macOS: npm resolves optional dependencies only for the
      # platform the lockfile was created on, so darwin-only packages
      # (dmg-license, iconv-corefoundation, smart-buffer) are missing from it.
      # Falling back to `npm install` resolves them on the runner.
      - name: Install dependencies
        shell: bash
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Test
        run: npm test

      # The dist:* scripts already pass "--publish never": electron-builder never
      # uploads anything itself, the release job below attaches the files.
      - name: Build installers
        shell: bash
        env:
          BUILD_SCRIPT: ${{ matrix.script }}
          # Signing secrets are only handed out for non-PR builds and only to the
          # matching platform. Missing secrets → empty values → unsigned build.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.platform == 'mac' && github.event_name != 'pull_request' && secrets.MAC_CSC_LINK != '') && 'true' || 'false' }}
          CSC_LINK: ${{ (matrix.platform == 'mac' && github.event_name != 'pull_request') && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ (matrix.platform == 'mac' && github.event_name != 'pull_request') && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ (matrix.platform == 'mac' && github.event_name != 'pull_request') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ (matrix.platform == 'mac' && github.event_name != 'pull_request') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ (matrix.platform == 'mac' && github.event_name != 'pull_request') && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ (matrix.platform == 'win' && github.event_name != 'pull_request') && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ (matrix.platform == 'win' && github.event_name != 'pull_request') && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          extra=""
          # notarize is false in electron-builder.yml; switch it on only when a
          # certificate AND the Apple credentials are available.
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
            extra="-c.mac.notarize=true"
          fi
          npm run "$BUILD_SCRIPT" -- $extra

      # Runs even after a failed build so the log shows what (if anything) was produced.
      - name: List build output
        if: always()
        shell: bash
        run: ls -la dist 2>/dev/null || echo "no dist directory"

      # Installers + everything electron-updater needs: latest*.yml (the feed) and
      # the *.blockmap files (differential download). Both must end up on the
      # release, see the header of this file.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: AugenPause-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/AugenPause-*.exe
            dist/AugenPause-*.dmg
            dist/AugenPause-*.zip
            dist/AugenPause-*.AppImage
            dist/AugenPause-*.deb
            dist/AugenPause-*.rpm
            dist/AugenPause-*.tar.gz
            dist/latest*.yml
            dist/*.blockmap

  # Same source, built with the last Electron that still supports macOS 10.15
  # (Electron 33 raised the minimum to macOS 11, Electron 44 to macOS 13).
  # Electron 32 receives no security updates any more – the artifacts are marked
  # "legacy" and the release notes say so. Only worth it for old Macs.
  macos-legacy:
    name: macos-legacy
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # build/electron-builder-legacy.yml extends electron-builder.yml and sets
      # `publish: null` (plus Electron 32 and the legacy artifact names). That is
      # what keeps this job from writing a latest-mac.yml: it would otherwise
      # overwrite the update feed of the Electron 44 macOS build in the release and
      # offer an unmaintained Electron 32 build as the update. The file is needed
      # because `-c.publish=null` does NOT work on the command line – the value
      # arrives as the string "null" and electron-builder then looks for a publish
      # provider of that name (electron-builder 26.15.3).
      - name: Build legacy installers (Electron 32, macOS 10.15+)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac dmg zip --x64 --arm64 --publish never \
            --config build/electron-builder-legacy.yml

      - name: List build output
        if: always()
        shell: bash
        run: ls -la dist 2>/dev/null || echo "no dist directory"

      # No latest*.yml / *.blockmap here on purpose – the legacy line never
      # self-updates (docs/ARCHITECTURE.md §12: macOS = "manual").
      - name: Upload legacy installers
        uses: actions/upload-artifact@v4
        with:
          name: AugenPause-macos-legacy
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/AugenPause-*legacy*.dmg
            dist/AugenPause-*legacy*.zip

  release:
    name: Release
    # always(): a platform that fails to build must not withhold the installers of
    # the others. The release then simply carries fewer files and can be re-run later.
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos-legacy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: AugenPause-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: |
          shopt -s nullglob extglob
          # Only the files a user actually downloads. *.blockmap are updater
          # internals and their sha512 hashes are already inside latest*.yml.
          files=(AugenPause-!(*.blockmap))
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no installers were produced by any platform"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          echo "Release files:"
          ls -la

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: AugenPause ${{ github.ref_name }}
          fail_on_unmatched_files: true
          body: |
            ## Installation

            | System | Datei |
            |---|---|
            | Windows | `AugenPause-Setup-*-x64.exe` (Installer), `AugenPause-Portable-*.exe` (ohne Installation), `-arm64` für ARM-Geräte |
            | macOS 13+ (Ventura und neuer) | `AugenPause-*-arm64.dmg` (Apple Silicon) oder `-x64.dmg` (Intel) |
            | macOS 10.15–12 (Catalina, Big Sur, Monterey) | `AugenPause-*-legacy-x64.dmg`, auf älteren ARM-Macs `-legacy-arm64.dmg` |
            | Linux | `*.AppImage` (überall, `chmod +x`), `*.deb` (Debian/Ubuntu), `*.rpm` (Fedora/openSUSE) |

            **Zu den `legacy`-Dateien:** gleicher Code, aber mit Electron 32 gebaut, der letzten Version mit
            Catalina-Unterstützung. Electron 32 bekommt **keine Sicherheitsupdates** mehr und ist auf einem alten Mac
            nicht getestet. Nimm sie nur, wenn dein macOS älter als 13 ist – sonst immer die normale Datei.

            Die Builds sind **nicht signiert**: Windows SmartScreen zeigt „Weitere Informationen → Trotzdem ausführen",
            macOS braucht Rechtsklick → Öffnen (oder `xattr -dr com.apple.quarantine /Applications/AugenPause.app`).
            Prüfsummen stehen in `SHA256SUMS.txt`.

            Die Dateien `latest*.yml` und `*.blockmap` gehören zur Update-Funktion und müssen
            nicht heruntergeladen werden.

            AugenPause prüft in der Standardeinstellung, ob hier eine neuere Version liegt
            (in den Einstellungen abschaltbar). Das ist die einzige Netzwerkverbindung der App,
            alle übrigen Daten bleiben lokal.
            Hinweise zu Linux (Wayland, Tray) stehen in `docs/PACKAGING.md`.
          # One pattern on purpose: `release/` contains exactly what the build jobs
          # uploaded – installers, their *.blockmap files and latest*.yml (the update
          # feed electron-updater reads) – plus SHA256SUMS.txt. A more specific list
          # would fail the release (fail_on_unmatched_files) whenever a platform
          # did not build, which must stay possible ("release what succeeded").
          files: release/*
