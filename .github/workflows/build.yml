# AugenPause – build installers for Windows, macOS and Linux.
#
# Generic workflow: only relevant if the project is pushed to a GitHub repository.
#   pull_request       → build + test (no secrets, no signing), artifacts downloadable from the run
#   workflow_dispatch  → same, started manually (signing if secrets exist)
#   tag "v*"           → same + published release with all installers attached
#
# Optional repository secrets (builds stay unsigned without them):
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD                 Windows code signing certificate (.pfx, base64)
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD                 macOS "Developer ID Application" certificate (.p12, base64)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   macOS notarization (only together with MAC_CSC_LINK)
#
# Hardening: never use pull_request_target here. For maximum supply-chain safety
# pin the third-party actions to full commit SHAs (see docs/PACKAGING.md).

name: Build

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform: win
            script: dist:win
          - name: macos
            os: macos-latest
            platform: mac
            script: dist:mac
          - name: linux
            os: ubuntu-latest
            platform: linux
            script: dist:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging tools (rpmbuild, bsdtar)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # The dist:* scripts already pass "--publish never": electron-builder never
      # uploads anything itself, the release job below attaches the files.
      - name: Build installers
        shell: bash
        env:
          BUILD_SCRIPT: ${{ matrix.script }}
          # Signing secrets are only handed out for non-PR builds and only to the
          # matching platform. Missing secrets → empty values → unsigned build.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.platform == 'mac' && github.event_name != 'pull_request' && secrets.MAC_CSC_LINK != '') && 'true' || 'false' }}
          CSC_LINK: ${{ (matrix.platform == 'mac' && github.event_name != 'pull_request') && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ (matrix.platform == 'mac' && github.event_name != 'pull_request') && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ (matrix.platform == 'mac' && github.event_name != 'pull_request') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ (matrix.platform == 'mac' && github.event_name != 'pull_request') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ (matrix.platform == 'mac' && github.event_name != 'pull_request') && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ (matrix.platform == 'win' && github.event_name != 'pull_request') && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ (matrix.platform == 'win' && github.event_name != 'pull_request') && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          extra=""
          # notarize is false in electron-builder.yml; switch it on only when a
          # certificate AND the Apple credentials are available.
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then
            extra="-c.mac.notarize=true"
          fi
          npm run "$BUILD_SCRIPT" -- $extra

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: AugenPause-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/AugenPause-*.exe
            dist/AugenPause-*.dmg
            dist/AugenPause-*.zip
            dist/AugenPause-*.AppImage
            dist/AugenPause-*.deb
            dist/AugenPause-*.rpm
            dist/AugenPause-*.tar.gz

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: AugenPause-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum AugenPause-* > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: AugenPause ${{ github.ref_name }}
          fail_on_unmatched_files: true
          body: |
            ## Installation

            | System | Datei |
            |---|---|
            | Windows | `AugenPause-Setup-*-x64.exe` (Installer), `AugenPause-Portable-*.exe` (ohne Installation), `-arm64` für ARM-Geräte |
            | macOS | `AugenPause-*-universal.dmg` (Intel + Apple Silicon) |
            | Linux | `*.AppImage` (überall, `chmod +x`), `*.deb` (Debian/Ubuntu), `*.rpm` (Fedora/openSUSE) |

            Die Builds sind **nicht signiert**: Windows SmartScreen zeigt „Weitere Informationen → Trotzdem ausführen",
            macOS braucht Rechtsklick → Öffnen (oder `xattr -dr com.apple.quarantine /Applications/AugenPause.app`).
            Prüfsummen stehen in `SHA256SUMS.txt`.

            Alle Daten bleiben lokal, die App baut keine Netzwerkverbindungen auf.
            Hinweise zu Linux (Wayland, Tray) stehen in `docs/PACKAGING.md`.
          files: |
            release/AugenPause-*
            release/SHA256SUMS.txt
